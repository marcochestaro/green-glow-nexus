<head>

<title>@marcomarkets</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e2e8f0;min-height:100vh;font-size:15px}
button{font-family:inherit;cursor:pointer}

.nav{padding:16px 20px 0;max-width:560px;margin:0 auto}
.nav-brand{font-size:.82rem;font-weight:600;color:#555}

.page{max-width:560px;margin:0 auto;padding:16px 20px 60px}

.heading{margin-bottom:24px}
.heading h1{font-size:1.3rem;font-weight:700;color:#fff;margin-bottom:3px}
.heading p{font-size:.78rem;color:#444}

.list-label{font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#333;margin-bottom:10px}

.script-list{display:flex;flex-direction:column;gap:1px;background:#1a1a1a;border-radius:12px;overflow:hidden}
.row{background:#111;padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:none;-webkit-tap-highlight-color:transparent;transition:background .1s}
.row:active{background:#161616}
.row-num{font-size:.72rem;font-weight:700;color:#333;width:18px;flex-shrink:0}
.row-info{flex:1;min-width:0}
.row-title{font-size:.88rem;font-weight:600;color:#e2e8f0;line-height:1.3;margin-bottom:4px}
.row-meta{display:flex;align-items:center;gap:6px}
.row-funnel{font-size:.6rem;font-weight:700;color:#444;text-transform:uppercase;letter-spacing:.06em}
.row-dot{width:3px;height:3px;border-radius:50%;background:#333;flex-shrink:0}
.row-type{font-size:.6rem;color:#333}
.row-cta{font-size:.6rem;font-weight:600;color:#4ade80}
.row-arr{font-size:.8rem;color:#333;flex-shrink:0}
.row-done .row-title{color:#333}
.row-done .row-num{color:#1f2f1f}
.row-done-tick{font-size:.7rem;color:#4ade80;flex-shrink:0}

.overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);overflow-y:auto;-webkit-overflow-scrolling:touch}
.overlay.on{display:block}
.sheet{background:#0f0f0f;border-radius:16px 16px 0 0;border-top:1px solid #1e1e1e;min-height:85vh;margin-top:8vh;padding-bottom:50px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px}
.sheet-num{font-size:.7rem;font-weight:700;color:#333}
.sheet-close{background:#1a1a1a;border:1px solid #222;color:#666;width:30px;height:30px;border-radius:50%;font-size:1rem;display:flex;align-items:center;justify-content:center}
.sheet-body{padding:0 20px}

.sh-title{font-size:1rem;font-weight:700;color:#fff;line-height:1.35;margin-bottom:12px}
.sh-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.badge{font-size:.6rem;font-weight:600;padding:2px 8px;border-radius:4px;background:#1a1a1a;color:#555;border:1px solid #222}
.badge.cta{background:#0a1f0a;color:#4ade80;border-color:#1a3a1a}

.film-note{background:#0a0a0a;border-left:2px solid #222;padding:10px 12px;border-radius:0 7px 7px 0;font-size:.72rem;color:#444;line-height:1.65;margin-bottom:10px}
.film-note b{color:#666}
.ost-note{background:#0d0d12;border-left:2px solid #2a2a4a;padding:9px 12px;border-radius:0 7px 7px 0;font-size:.72rem;color:#6b6baa;line-height:1.5;margin-bottom:16px}
.ost-note b{color:#8888cc}

.ver-row{display:flex;gap:2px;background:#111;border:1px solid #1e1e1e;border-radius:20px;padding:2px;margin-bottom:14px;width:fit-content}
.vbtn{padding:4px 12px;border-radius:16px;font-size:.62rem;font-weight:600;border:none;color:#444;background:none}
.vbtn.on{background:#1e1e1e;color:#fff}

.lines{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
.line{display:grid;grid-template-columns:56px 1fr;gap:8px;align-items:start}
.lmeta{text-align:right;padding-top:8px}
.lseg{font-size:.58rem;font-weight:700;color:#333;display:block}
.ldur{font-size:.55rem;color:#2a2a2a;display:block;margin-top:1px}
.lbub{background:#111;border:1px solid #1e1e1e;border-radius:8px;padding:9px 11px;font-size:.78rem;color:#94a3b8;line-height:1.6}
.lbub.hook{border-color:#1a2a1a;background:#0a0f0a}
.lbub.cta{border-color:#1a2a1a;background:#080f08}

.cap-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#333;margin-bottom:8px}
.cap-box{background:#111;border:1px solid #1e1e1e;border-radius:8px;padding:12px;font-size:.77rem;color:#555;line-height:1.85;white-space:pre-wrap;margin-bottom:6px}

.act-row{display:flex;gap:8px;margin-top:14px}
.abtn{flex:1;padding:12px;border-radius:9px;font-size:.8rem;font-weight:600;border:none}
.abtn-grey{background:#1a1a1a;color:#e2e8f0}
.abtn-grey:active{background:#222}
.abtn-done{background:#0a1a0a;color:#4ade80;border:1px solid #1a3a1a}
.abtn-done.on{background:#0f2010}

.cbtn{display:inline-flex;align-items:center;background:none;border:1px solid #1e1e1e;color:#333;padding:2px 7px;border-radius:4px;font-size:.57rem;cursor:pointer;margin-top:4px}
.cbtn.ok{border-color:#4ade80;color:#4ade80}

.stories-section{max-width:560px;margin:0 auto;padding:0 20px 60px}
.stories-label{font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#333;margin-bottom:10px}
.story-list{display:flex;flex-direction:column;gap:1px;background:#1a1a1a;border-radius:12px;overflow:hidden}
.story-row{background:#111;padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:none;-webkit-tap-highlight-color:transparent;transition:background .1s}
.story-row:active{background:#161616}
.story-day{font-size:.65rem;font-weight:700;color:#333;width:28px;flex-shrink:0}
.story-info{flex:1;min-width:0}
.story-title{font-size:.88rem;font-weight:600;color:#e2e8f0;line-height:1.3;margin-bottom:3px}
.story-meta{display:flex;align-items:center;gap:5px}
.story-type{font-size:.6rem;color:#333}
.story-cat{font-size:.6rem;font-weight:600;padding:1px 6px;border-radius:3px}
.story-cat.life{color:#a78bfa;background:#12101e}
.story-cat.value{color:#60a5fa;background:#0a0f1e}
.story-cat.mixed{color:#f59e0b;background:#1a1200}
.story-arr{font-size:.8rem;color:#333;flex-shrink:0}
.story-done .story-title{color:#333}
.story-done-tick{font-size:.7rem;color:#4ade80;flex-shrink:0}

.ssheet{background:#0f0f0f;border-radius:16px 16px 0 0;border-top:1px solid #1e1e1e;min-height:85vh;margin-top:8vh;padding-bottom:50px}
.ssheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px}
.ssheet-day{font-size:.7rem;font-weight:700;color:#333}
.ssheet-body{padding:0 20px}
.ssheet-title{font-size:1rem;font-weight:700;color:#fff;line-height:1.35;margin-bottom:10px}
.slide-count{font-size:.62rem;color:#444;margin-bottom:12px}
.slide{background:#111;border:1px solid #1e1e1e;border-radius:9px;padding:12px 14px;margin-bottom:8px}
.slide-num{font-size:.58rem;font-weight:700;color:#333;margin-bottom:5px}
.slide-text{font-size:.8rem;color:#94a3b8;line-height:1.65}
.slide-note{font-size:.68rem;color:#3a3a3a;margin-top:5px;font-style:italic}
</style>
</head>

var checks=JSON.parse(localStorage.getItem('mm_checks')||'{}');
var curId=null;
var curVer='full';

function buildList(){
  var el=document.getElementById('script-list');
  el.innerHTML='';
  SCRIPTS.forEach(function(s,i){
    var done=!!checks[s.id];
    var row=document.createElement('button');
    row.className='row'+(done?' row-done':'');
    row.innerHTML=
      '<div class="row-num">'+(i+1)+'</div>'
      +'<div class="row-info">'
      +'<div class="row-title">'+s.title+'</div>'
      +'<div class="row-meta">'
      +'<div class="row-funnel">'+s.funnel+'</div>'
      +(s.cta?'<div class="row-dot"></div><div class="row-cta">CTA</div>':'')
      +'</div>'
      +'</div>'
      +(done?'<div class="row-done-tick">&#10003;</div>':'<div class="row-arr">&#8599;</div>');
    row.addEventListener('click',function(){openSheet(s.id);});
    el.appendChild(row);
  });
}
buildList();

function filterLines(lines,ver){
  if(ver==='full')return lines;
  var hook=lines.filter(function(l){return l.cls==='hook';});
  var cta=lines.filter(function(l){return l.cls==='cta';});
  if(ver==='short')return hook.concat(cta);
  var mid=lines.filter(function(l){return l.cls!=='hook'&&l.cls!=='cta';}).slice(0,2);
  return hook.concat(mid).concat(cta);
}
function totalSec(lines){return lines.reduce(function(t,l){var s=parseInt(l.tag||'0');return t+(isNaN(s)?0:s);},0);}
function durStr(lines,ver){var t=totalSec(filterLines(lines,ver));if(!t)return '';var m=Math.floor(t/60),s=t%60;return m?(m+'m '+(s?s+'s':'')):(s+'s');}

function mkLines(lines,ver){
  return '<div class="lines">'+filterLines(lines,ver).map(function(l){
    return '<div class="line">'
      +'<div class="lmeta"><span class="lseg">'+l.time+'</span>'+(l.tag?'<span class="ldur">'+l.tag+'</span>':'')+'</div>'
      +'<div class="lbub '+l.cls+'">'+l.text
      +'<br><button class="cbtn" onclick="cpText(this,'+JSON.stringify(l.text)+')">Copy</button>'
      +'</div></div>';
  }).join('')+'</div>';
}

function openSheet(id){
  curId=id;curVer='full';
  document.getElementById('overlay').classList.add('on');
  document.body.style.overflow='hidden';
  renderSheet();
}
function renderSheet(){
  var s=SCRIPTS[curId];
  var idx=SCRIPTS.indexOf(s)+1;
  document.getElementById('sh-num').textContent='Script '+idx+' of 7 — '+s.funnel;
  var short=durStr(s.lines,'short'),mid=durStr(s.lines,'mid'),full=durStr(s.lines,'full');
  document.getElementById('sh-body').innerHTML=
    '<div class="sh-title">'+s.title+'</div>'
    +'<div class="sh-row">'
    +'<div class="badge">'+s.type+'</div>'
    +(s.cta?'<div class="badge cta">Has CTA</div>':'<div class="badge">No CTA</div>')
    +'</div>'
    +'<div class="film-note"><b>How to film:</b> '+s.film+'</div>'
    +(s.ost?'<div class="ost-note"><b>On-screen text:</b> '+s.ost+'</div>':'')
    +'<div class="ver-row">'
    +'<button class="vbtn'+(curVer==='short'?' on':'')+'" onclick="setVer(\'short\')">Short'+(short?' \xb7 '+short:'')+'</button>'
    +'<button class="vbtn'+(curVer==='mid'?' on':'')+'" onclick="setVer(\'mid\')">Medium'+(mid?' \xb7 '+mid:'')+'</button>'
    +'<button class="vbtn'+(curVer==='full'?' on':'')+'" onclick="setVer(\'full\')">Full'+(full?' \xb7 '+full:'')+'</button>'
    +'</div>'
    +mkLines(s.lines,curVer)
    +'<div class="cap-label">Caption</div>'
    +'<div class="cap-box" id="cap-box">'+s.caption+'</div>'
    +'<button class="cbtn" onclick="cpCap()">Copy Caption</button>'
    +'<div class="act-row">'
    +'<button class="abtn abtn-grey" onclick="cpAll()">Copy Script</button>'
    +'<button class="abtn abtn-done'+(checks[curId]?' on':'')+'" id="done-btn" onclick="toggleDone()">'+(checks[curId]?'Posted ✓':'Mark as Posted')+'</button>'
    +'</div>';
}
function setVer(ver){curVer=ver;renderSheet();}
document.getElementById('sh-close').addEventListener('click',closeSheet);
document.getElementById('overlay').addEventListener('click',function(e){if(e.target===document.getElementById('overlay'))closeSheet();});
function closeSheet(){document.getElementById('overlay').classList.remove('on');document.body.style.overflow='';}
function cpText(btn,text){navigator.clipboard.writeText(text).then(function(){btn.textContent='Copied';btn.classList.add('ok');setTimeout(function(){btn.textContent='Copy';btn.classList.remove('ok');},1800);});}
function cpCap(){var el=document.getElementById('cap-box');if(el)navigator.clipboard.writeText(el.textContent);}
function cpAll(){navigator.clipboard.writeText(SCRIPTS[curId].lines.map(function(l){return l.text;}).join('\n\n'));}
function toggleDone(){
  checks[curId]=!checks[curId];
  localStorage.setItem('mm_checks',JSON.stringify(checks));
  var btn=document.getElementById('done-btn');
  if(btn){btn.className='abtn abtn-done'+(checks[curId]?' on':'');btn.textContent=checks[curId]?'Posted ✓':'Mark as Posted';}
  buildList();
}

var STORIES=[
{id:'s0',day:'Mon',cat:'life',title:'Start of the week — where you’re at',
 slides:[
  {text:'Photo or short clip of your setup for the week. Laptop open, coffee, wherever you’re working from.',note:'Single frame. Caption optional: "week starts now" or nothing at all.'}
 ]},
{id:'s1',day:'Tue',cat:'value',title:'One thing that’s working in ads right now',
 slides:[
  {text:'Slide 1\n"something i’ve been noticing across client accounts lately…"'},
  {text:'Slide 2\n[the actual observation — e.g. "simple hooks outperforming clever ones every time right now"]'},
  {text:'Slide 3\n"just something worth testing if you’re running ads"',note:'Keep it specific. One real observation, not general advice.'}
 ]},
{id:'s2',day:'Wed',cat:'life',title:'Mid-week real life',
 slides:[
  {text:'Gym, outdoors, wherever you are. One photo. No caption needed or just "mid week".',note:'Single frame. The point is showing up as a real person, not a content machine.'}
 ]},
{id:'s3',day:'Thu',cat:'mixed',title:'Client work — something you fixed or noticed',
 slides:[
  {text:'Slide 1: set the scene\n"was looking at a client’s account this week…"'},
  {text:'Slide 2: the problem\n[what you found — keep it vague enough to protect the client]'},
  {text:'Slide 3: what you did\n[the fix — specific and practical]'},
  {text:'Slide 4: CTA (optional)\n"if your ads feel off, DM me SCALE and i’ll take a look"',note:'Only add slide 4 on a CTA week. Otherwise end on slide 3.'}
 ]},
{id:'s4',day:'Fri',cat:'value',title:'Myth vs reality — Meta ads',
 slides:[
  {text:'Slide 1\n"something i hear all the time…"\n[the myth — e.g. "you need a big budget to get results"]'},
  {text:'Slide 2\n"here’s what’s actually true…"\n[the reality — specific and honest]'},
  {text:'Slide 3\n[one line takeaway they can act on]',note:'Keep the myth something you genuinely hear.'}
 ]},
{id:'s5',day:'Sat',cat:'life',title:'Outside — nature, walk, gym, wherever',
 slides:[
  {text:'One photo from wherever you are. Outdoors, gym, anywhere that’s not a desk. No explanation needed.',note:'Single frame. Trust-building through showing a real life.'}
 ]},
{id:'s6',day:'Sun',cat:'mixed',title:'Look ahead — what’s coming this week',
 slides:[
  {text:'Slide 1\n"posting this week…"\n[tease 1-2 topics from your upcoming reels without giving it away]'},
  {text:'Slide 2\n"also working on…"\n[something real you’re doing for clients or in the business]',note:'Builds anticipation. Makes followers feel in on something before it drops.'}
 ]},
];

var schecks=JSON.parse(localStorage.getItem('mm_schecks')||'{}');
var curStory=null;

function buildStoryList(){
  var el=document.getElementById('story-list');
  el.innerHTML='';
  STORIES.forEach(function(s){
    var done=!!schecks[s.id];
    var frameCount=s.slides.length===1?'1 frame':s.slides.length+' slides';
    var row=document.createElement('button');
    row.className='story-row'+(done?' story-done':'');
    row.innerHTML=
      '<div class="story-day">'+s.day+'</div>'
      +'<div class="story-info">'
      +'<div class="story-title">'+s.title+'</div>'
      +'<div class="story-meta">'
      +'<span class="story-cat '+s.cat+'">'+(s.cat==='life'?'Life':s.cat==='value'?'Value':'Mixed')+'</span>'
      +'<span class="story-type">'+frameCount+'</span>'
      +'</div></div>'
      +(done?'<div class="story-done-tick">✓</div>':'<div class="story-arr">&#8599;</div>');
    row.addEventListener('click',function(){openStory(s.id);});
    el.appendChild(row);
  });
}
buildStoryList();

function openStory(id){
  curStory=id;
  document.getElementById('story-overlay').classList.add('on');
  document.body.style.overflow='hidden';
  renderStory();
}
function renderStory(){
  var s=STORIES.find(function(x){return x.id===curStory;});
  var frameLabel=s.slides.length===1?'Single frame':s.slides.length+' slides';
  document.getElementById('ss-day').textContent=s.day+' — '+(s.cat==='life'?'Life':s.cat==='value'?'Value':'Mixed');
  document.getElementById('ss-body').innerHTML=
    '<div class="ssheet-title">'+s.title+'</div>'
    +'<div class="slide-count">'+frameLabel+'</div>'
    +s.slides.map(function(sl,i){
      return '<div class="slide">'
        +(s.slides.length>1?'<div class="slide-num">Slide '+(i+1)+'</div>':'')
        +'<div class="slide-text">'+sl.text.replace(/\n/g,'<br>')+'</div>'
        +(sl.note?'<div class="slide-note">'+sl.note+'</div>':'')
        +'</div>';
    }).join('')
    +'<div class="act-row">'
    +'<button class="abtn abtn-done'+(schecks[curStory]?' on':'')+'" id="sdone-btn" onclick="toggleStoryDone()">'+(schecks[curStory]?'Posted ✓':'Mark as Posted')+'</button>'
    +'</div>';
}
document.getElementById('ss-close').addEventListener('click',function(){document.getElementById('story-overlay').classList.remove('on');document.body.style.overflow='';});
document.getElementById('story-overlay').addEventListener('click',function(e){if(e.target===document.getElementById('story-overlay')){document.getElementById('story-overlay').classList.remove('on');document.body.style.overflow='';}});
function toggleStoryDone(){
  schecks[curStory]=!schecks[curStory];
  localStorage.setItem('mm_schecks',JSON.stringify(schecks));
  var btn=document.getElementById('sdone-btn');
  if(btn){btn.className='abtn abtn-done'+(schecks[curStory]?' on':'');btn.textContent=schecks[curStory]?'Posted ✓':'Mark as Posted';}
  buildStoryList();
}
</script>
